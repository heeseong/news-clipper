server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # tus upload chunks are 50 MB (frontend/src/pages/UploadPage.tsx)
    client_max_body_size 100m;

    # API (same origin, so no CORS in production)
    location ~ ^/(api|media|healthz|readyz)(/|$) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # Stream upload chunks to the API instead of spooling them to disk first
        proxy_request_buffering off;
        # Server-sent events (/api/events)
        proxy_buffering off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths serve index.html
    location / {
        try_files $uri /index.html;
    }
}
