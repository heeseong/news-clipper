[project]
name = "news-clipper-backend"
version = "0.1.0"
description = "News Clipper backend: cue sheet/script ingestion, alignment, clipping, publishing"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "httpx>=0.27",  # MARS-L client
    "numpy>=1.26",
    "ctc-segmentation>=1.7",  # forced alignment (spec 5.5)
    "anthropic>=2.11",  # LLM suggestions for titles and descriptions (spec 5.7)
    "pillow>=11",  # thumbnail text overlay
    "opencv-python-headless>=4.10",  # thumbnail scoring: sharpness, faces (YuNet)
]

[project.optional-dependencies]
# The acoustic model for the align worker (install torch from the CPU index first:
# pip install torch --index-url https://download.pytorch.org/whl/cpu).
model = [
    "torch>=2.2",
    "transformers>=4.40",
    "soundfile>=0.12",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.newsroom" = ["fixtures/*.json"]  # synthetic MARS-L responses for the fake newsroom
"app.thumbnails" = ["fonts/*", "models/*"]  # bundled Korean font (OFL) and face detector (MIT)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # long Korean fixtures and regexes; the formatter handles code

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]  # not the local alembic/ migrations folder
